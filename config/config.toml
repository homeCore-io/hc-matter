[homecore]
broker_host = "127.0.0.1"
broker_port = 1883
plugin_id = "plugin.matter"
password = ""

[matter]
# controller | bridge | both
role = "both"

# Relative paths are resolved from this config directory.
storage_dir = "data/matter"

# Keep plugin status fresh while Matter controller/bridge behavior is scaffold-only.
heartbeat_secs = 30

[matter.commissioner]
vendor_id = 65521
product_id = 32768

# backend:
# - chip-tool: use external CHIP Tool for real commissioning operations
# - spike: legacy simulated commissioning path
backend = "chip-tool"

# Binary used when backend = "chip-tool".
# Relative paths are resolved from this config directory, so ../bin/chip-tool
# points at plugins/hc-matter/bin/chip-tool in standard layouts.
binary = "../bin/chip-tool"

# Timeout for external commission command execution
timeout_secs = 90

[matter.network]
# interface = "eth0"

[matter.bridge]
# Optional include/exclude rules for bridge endpoint export.
# include_ids = ["matter_spike_node_1", "matter_spike_temp_1"]
# exclude_ids = ["matter_spike_bridge_1"]
# device_type_filter = "light"
# area_filter = "office"

# Salt for deterministic endpoint ID derivation.
endpoint_id_salt = "plugin.matter"

[matter.security]
# plaintext | env
# - plaintext: writes fabric_store.json unencrypted (legacy/dev behavior)
# - env: encrypts fabric_store.json using HC_MATTER_STORE_KEY (or key_env_var)
key_provider = "plaintext"

# Env var name used when key_provider = "env".
key_env_var = "HC_MATTER_STORE_KEY"

# Relative to config dir unless absolute. Trigger export with:
# {"action":"backup_fabric"} to matter_controller cmd.
backup_dir = "backups"

[matter.spike]
# MAT-003: set true to run commissioning/read/toggle/bridge spike behavior.
enabled = false
test_node_id = "matter_spike_node_1"
bridge_endpoint_id = "matter_spike_bridge_1"
advertise_bridge_endpoint = true
