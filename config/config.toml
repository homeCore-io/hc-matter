[homecore]
broker_host = "127.0.0.1"
broker_port = 1883
plugin_id = "plugin.matter"
password = ""

[matter]
# controller | bridge | both
role = "both"

# Relative paths are resolved from this config directory.
storage_dir = "data/matter"

# Keep plugin status fresh while Matter controller/bridge behavior is scaffold-only.
heartbeat_secs = 30

[matter.commissioner]
vendor_id = 65521
product_id = 32768

[matter.network]
# interface = "eth0"

[matter.bridge]
# Optional include/exclude rules for bridge endpoint export.
# include_ids = ["matter_spike_node_1", "matter_spike_temp_1"]
# exclude_ids = ["matter_spike_bridge_1"]
# device_type_filter = "light"
# area_filter = "office"

# Salt for deterministic endpoint ID derivation.
endpoint_id_salt = "plugin.matter"

[matter.spike]
# MAT-003: set true to run commissioning/read/toggle/bridge spike behavior.
enabled = true
test_node_id = "matter_spike_node_1"
bridge_endpoint_id = "matter_spike_bridge_1"
advertise_bridge_endpoint = true
