[workspace]

[package]
name = "hc-matter"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "hc-matter"
path = "src/main.rs"

[features]
default = []
matter-stack = ["dep:matter-rs", "dep:async-io", "dep:socket2", "dep:embassy-time", "dep:libc"]

[dependencies]
tokio = { version = "1", features = ["full"] }
rumqttc = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
tracing-appender = "0.2"
heapless = "0.8"
base64 = "0.22"
sha2 = "0.10"
chacha20poly1305 = "0.10"
async-io = { version = "2", optional = true }
socket2 = { version = "0.5", optional = true }
embassy-time = { version = "0.5", features = ["std", "generic-queue-64"], optional = true }
libc = { version = "0.2", optional = true }
matter-rs = { git = "https://github.com/project-chip/rs-matter", package = "rs-matter", features = ["async-io"], optional = true }
